  <text x="120" y="637" fill="#765F68" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1">TRUE LAUNCHER SIZES</text>
  <rect x="120" y="675" width="96" height="96" rx="21" fill="url(#tile)"/>
  <g transform="translate(129.09 683.25) scale(.30375)"><path fill="none" stroke="#FFF9FA" stroke-width="28" stroke-linecap="round" d="M48 65v66c0 53 31 82 80 82s80-32 80-84V49"/><path fill="none" stroke="#FFD7E4" stroke-width="28" stroke-linecap="round" d="M91 92v39c0 27 14 43 37 43s37-18 37-45V77"/></g>
  <rect x="276" y="691" width="64" height="64" rx="14" fill="url(#tile)"/>
  <g transform="translate(282.06 696.5) scale(.2025)"><path fill="none" stroke="#FFF9FA" stroke-width="28" stroke-linecap="round" d="M48 65v66c0 53 31 82 80 82s80-32 80-84V49"/><path fill="none" stroke="#FFD7E4" stroke-width="28" stroke-linecap="round" d="M91 92v39c0 27 14 43 37 43s37-18 37-45V77"/></g>
  <rect x="400" y="699" width="48" height="48" rx="11" fill="url(#tile)"/>
  <g transform="translate(404.55 703.13) scale(.15188)"><path fill="none" stroke="#FFF9FA" stroke-width="28" stroke-linecap="round" d="M48 65v66c0 53 31 82 80 82s80-32 80-84V49"/><path fill="none" stroke="#FFD7E4" stroke-width="28" stroke-linecap="round" d="M91 92v39c0 27 14 43 37 43s37-18 37-45V77"/></g>
  <rect x="508" y="707" width="32" height="32" rx="7" fill="url(#tile)"/>
  <g transform="translate(511.03 709.75) scale(.10125)"><path fill="none" stroke="#FFF9FA" stroke-width="28" stroke-linecap="round" d="M48 65v66c0 53 31 82 80 82s80-32 80-84V49"/><path fill="none" stroke="#FFD7E4" stroke-width="28" stroke-linecap="round" d="M91 92v39c0 27 14 43 37 43s37-18 37-45V77"/></g>
  <text x="120" y="791" fill="#765F68" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="15">96 px</text>
  <text x="276" y="791" fill="#765F68" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="15">64 px</text>
  <text x="400" y="791" fill="#765F68" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="15">48 px</text>
  <text x="508" y="791" fill="#765F68" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="15">32 px</text>
  <g transform="translate(614 666) scale(.38)">
    <path fill="none" stroke="#2A131E" stroke-width="28" stroke-linecap="round" d="M48 65v66c0 53 31 82 80 82s80-32 80-84V49"/>
    <path fill="none" stroke="#B51E52" stroke-width="28" stroke-linecap="round" d="M91 92v39c0 27 14 43 37 43s37-18 37-45V77"/>
  </g>
  <text x="730" y="724" fill="#2A131E" font-family="Epilogue, Arial, sans-serif" font-size="30" font-weight="700">BetterYou</text>
  <text x="730" y="757" fill="#765F68" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16">Symbol + live product typography</text>
  <rect x="80" y="875" width="1280" height="400" rx="38" fill="#2A131E"/>
  <text x="120" y="950" fill="#FFD7E4" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1">SYSTEM CHECK</text>
  <text x="120" y="1015" fill="#FFF9FA" font-family="Epilogue, Arial, sans-serif" font-size="30" font-weight="700">One shape, every launcher context.</text>
  <text x="120" y="1065" fill="#EAD7DE" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="19">The paired paths stay distinct through circular, squircle, tinted, and 32 px treatments.</text>
  <circle cx="140" cy="1160" r="20" fill="#B51E52"/><text x="176" y="1167" fill="#FFF9FA" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18">BetterYou Berry</text>
  <circle cx="390" cy="1160" r="20" fill="#D94B7C"/><text x="426" y="1167" fill="#FFF9FA" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18">Berry Light</text>
  <circle cx="620" cy="1160" r="20" fill="#FFD7E4"/><text x="656" y="1167" fill="#FFF9FA" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18">Petal</text>
  <circle cx="810" cy="1160" r="20" fill="#FFF9FA"/><text x="846" y="1167" fill="#FFF9FA" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18">Warm White</text>
  <text x="120" y="1234" fill="#A38E96" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="15">Production artwork keeps the Android mark inside the official centered 66/108 safe zone.</text>
