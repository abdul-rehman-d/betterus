<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc">
  <title id="title">BetterYou launcher icon stress tests</title>
  <desc id="desc">The BetterYou icon shown through iOS, Android circle, Android squircle, monochrome, and small-size contexts.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9FA"/>
      <stop offset="1" stop-color="#FBEFF3"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D94B7C"/>
      <stop offset="0.52" stop-color="#B51E52"/>
      <stop offset="1" stop-color="#81143C"/>
    </linearGradient>
    <symbol id="app-tile" viewBox="0 0 1024 1024">
      <rect width="1024" height="1024" fill="url(#tile)"/>
      <g transform="translate(97 88) scale(3.24)">
        <path fill="none" stroke="#FFF9FA" stroke-width="28" stroke-linecap="round" d="M48 65v66c0 53 31 82 80 82s80-32 80-84V49"/>
        <path fill="none" stroke="#FFD7E4" stroke-width="28" stroke-linecap="round" d="M91 92v39c0 27 14 43 37 43s37-18 37-45V77"/>
      </g>
    </symbol>
    <clipPath id="ios"><rect x="80" y="190" width="260" height="260" rx="58"/></clipPath>
    <clipPath id="circle"><circle cx="510" cy="320" r="130"/></clipPath>
    <clipPath id="squircle"><rect x="680" y="190" width="260" height="260" rx="82"/></clipPath>
  </defs>
  <rect width="1440" height="1440" fill="url(#page)"/>
  <text x="80" y="86" fill="#2A131E" font-family="Epilogue, Arial, sans-serif" font-size="42" font-weight="700">BetterYou launcher tests</text>
  <text x="80" y="128" fill="#765F68" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="20">iOS, Android masks, themed icon, and true small-size checks</text>

  <g clip-path="url(#ios)">
    <rect x="80" y="190" width="260" height="260" fill="url(#tile)"/>
    <g transform="translate(104.63 212.34) scale(.82266)">
      <path fill="none" stroke="#FFF9FA" stroke-width="28" stroke-linecap="round" d="M48 65v66c0 53 31 82 80 82s80-32 80-84V49"/>
      <path fill="none" stroke="#FFD7E4" stroke-width="28" stroke-linecap="round" d="M91 92v39c0 27 14 43 37 43s37-18 37-45V77"/>
    </g>
  </g>
  <text x="80" y="490" fill="#2A131E" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18" font-weight="700">iOS rounded mask</text>

  <g clip-path="url(#circle)">
    <rect x="380" y="190" width="260" height="260" fill="url(#tile)"/>
    <g transform="translate(404.63 212.34) scale(.82266)">
      <path fill="none" stroke="#FFF9FA" stroke-width="28" stroke-linecap="round" d="M48 65v66c0 53 31 82 80 82s80-32 80-84V49"/>
      <path fill="none" stroke="#FFD7E4" stroke-width="28" stroke-linecap="round" d="M91 92v39c0 27 14 43 37 43s37-18 37-45V77"/>
    </g>
  </g>
  <text x="380" y="490" fill="#2A131E" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18" font-weight="700">Android circle</text>

  <g clip-path="url(#squircle)">
    <rect x="680" y="190" width="260" height="260" fill="url(#tile)"/>
    <g transform="translate(704.63 212.34) scale(.82266)">
      <path fill="none" stroke="#FFF9FA" stroke-width="28" stroke-linecap="round" d="M48 65v66c0 53 31 82 80 82s80-32 80-84V49"/>
      <path fill="none" stroke="#FFD7E4" stroke-width="28" stroke-linecap="round" d="M91 92v39c0 27 14 43 37 43s37-18 37-45V77"/>
    </g>
  </g>
  <text x="680" y="490" fill="#2A131E" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18" font-weight="700">Android squircle</text>

  <rect x="980" y="190" width="260" height="260" rx="82" fill="#E8C6D3"/>
  <g transform="translate(1002 209) scale(0.82)">
    <path fill="none" stroke="#5D2A42" stroke-width="28" stroke-linecap="round" d="M48 65v66c0 53 31 82 80 82s80-32 80-84V49"/>
    <path fill="none" stroke="#5D2A42" stroke-width="28" stroke-linecap="round" d="M91 92v39c0 27 14 43 37 43s37-18 37-45V77"/>
  </g>
  <text x="980" y="490" fill="#2A131E" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18" font-weight="700">Android themed</text>

